name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, production-upgrade ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-build-and-test:
    name: Security Audit, Build & Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Scan (Zero High/Critical)
        run: npm audit --omit=dev

      - name: Build Production Frontend Assets
        run: npm run build

      - name: Execute In-Process Automated Test Suite (29 Tests)
        env:
          NODE_ENV: test
          PORT: 5099
          MONGODB_URI: mongodb://127.0.0.1:27017/test_counselling_portal
          SESSION_SECRET: test-session-secret-key-32-chars-minimum-for-testing
          PROVIDER_PASSWORD: SabujCare#2026!
          BOOTSTRAP_ADMIN_EMAIL: sabujd880@gmail.com
        run: node tests/run_tests.js

  docker-image-verification:
    name: Production Docker Image Build Verification
    needs: audit-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: counselling-portal:ci-test
