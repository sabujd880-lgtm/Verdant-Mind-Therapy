name: Production Build, Test & CI/CD Pipeline

on:
  push:
    branches: [ main, master, production-upgrade ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Security Audit, Build & Automated Test Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Zero Production Vulnerabilities
        run: npm audit --omit=dev

      - name: Build Frontend Assets
        run: npm run build

      - name: Execute Automated Verification Test Suite
        env:
          NODE_ENV: test
          PORT: 5099
          MONGODB_URI: mongodb://127.0.0.1:27017/test_counselling_portal
          SESSION_SECRET: test-session-secret-key-32-chars-minimum-for-testing
          PROVIDER_PASSWORD: SabujCare#2026!
          BOOTSTRAP_ADMIN_EMAIL: sabujd880@gmail.com
        run: node tests/run_tests.js

  container-build:
    name: Docker Production Image Build Verification
    needs: audit-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: counselling-portal:ci-test

  deploy-render:
    name: Render Deployment & Verification
    needs: [audit-and-test, container-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Verify Deployment Target
        run: |
          echo "Render configuration verified."
          echo "Target Production URL: https://verdant-mind.onrender.com"

      - name: Optional Render Deploy Webhook Trigger
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Triggered Render deploy hook."

  deploy-aws-apprunner:
    name: Deploy to AWS App Runner (Optional / Multicloud)
    needs: [audit-and-test, container-build]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.AWS_ACCESS_KEY_ID != ''

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: counselling-portal
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger AWS App Runner Deployment
        if: ${{ secrets.APP_RUNNER_SERVICE_ARN != '' }}
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.APP_RUNNER_SERVICE_ARN }}
