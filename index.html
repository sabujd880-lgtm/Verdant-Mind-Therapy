    <script>
      // Clear legacy service worker caches from previous psychology-portfolio builds
      (function() {
        var PURGE_KEY = 'vm_cache_purge_v3';
        if ('serviceWorker' in navigator && !sessionStorage.getItem(PURGE_KEY)) {
          sessionStorage.setItem(PURGE_KEY, 'true');
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].update();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                if (names[i].indexOf('psychology') !== -1 || names[i].indexOf('precache') !== -1) {
                  caches.delete(names[i]);
                }
              }
            });
          }
        }
      })();
    </script>
